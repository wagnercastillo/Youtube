<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: "Archivo Black", "Arial Black", sans-serif;
    background-color: #17352A;
    background-image: radial-gradient(ellipse 60px 26px at 30px 30px, #1F4535 98%, transparent 100%),
      radial-gradient(ellipse 26px 60px at 120px 110px, #1F4535 98%, transparent 100%),
      radial-gradient(ellipse 50px 20px at 170px 40px, #22503D 98%, transparent 100%);
    background-size: 220px 180px; position: relative; }
  .head { position: absolute; left: 0; top: 0; width: 1080px; height: 230px; background: #1B1B2F; display: flex; align-items: center; gap: 30px; padding: 40px 50px 0; }
  .head svg { width: 150px; height: 150px; border-radius: 75px; background: #6E8B4E; border: 7px solid #F2B33D; flex: none; }
  .name { color: #FFF; font-size: 56px; line-height: 1.05; }
  .name small { display: block; font-family: Arial, sans-serif; font-weight: 700; font-size: 34px; color: #A9C7B4; margin-top: 8px; }
  .top { position: absolute; left: 0; top: 300px; width: 1080px; text-align: center; }
  .top span { display: inline-block; font-size: 150px; line-height: 1; color: #1B1B2F; background: #F2B33D; padding: 22px 40px 10px;
    border: 12px solid #1B1B2F; border-radius: 28px; box-shadow: 14px 14px 0 #1B1B2F; transform: rotate(-3deg); }
  .sub { position: absolute; left: 0; top: 560px; width: 1080px; text-align: center; font-size: 92px; color: #FFF;
    -webkit-text-stroke: 18px #1B1B2F; paint-order: stroke fill; line-height: 1.05; }
  .bubble { position: absolute; left: 90px; top: 860px; width: 900px; background: #FFF; border: 10px solid #1B1B2F; border-radius: 40px;
    border-bottom-left-radius: 8px; box-shadow: 12px 12px 0 #1B1B2F; padding: 34px 40px 26px; }
  .who { font-size: 40px; color: #C1440E; }
  .paper { margin: 16px 0; background: #F3E6C4; border: 6px solid #1B1B2F; padding: 40px 30px; transform: rotate(-2deg);
    font-size: 70px; line-height: 1.08; color: #7B1E1E; text-align: center; }
  .meta { display: flex; justify-content: space-between; font-family: Arial, sans-serif; font-weight: 900; font-size: 44px; }
  .meta .y { color: #5B5B6E; } .meta .seen { color: #2C7FB8; }
  .stamp { position: absolute; left: 0; top: 1500px; width: 1080px; text-align: center; }
  .stamp span { display: inline-block; white-space: nowrap; font-size: 92px; color: #E63946; border: 16px solid #E63946; border-radius: 26px; padding: 14px 40px 4px;
    background: rgba(255,253,246,0.95); transform: rotate(-7deg); }
</style></head>
<body>
  <div class="head">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="70" r="34" fill="#F2C9A0" stroke="#1B1B2F" stroke-width="5"/>
      <path d="M18 62 Q22 18 60 16 Q98 18 102 62 Z" fill="#5E6B3A" stroke="#1B1B2F" stroke-width="5"/>
      <rect x="14" y="58" width="92" height="10" rx="5" fill="#4A5530" stroke="#1B1B2F" stroke-width="4"/>
      <circle cx="48" cy="78" r="4" fill="#1B1B2F"/><circle cx="72" cy="78" r="4" fill="#1B1B2F"/>
      <path d="M48 94 Q60 90 72 94" stroke="#1B1B2F" stroke-width="4" fill="none"/></svg>
    <div class="name">Tte. Hiroo Onoda<small>últ. vez en 1944 · sin señal</small></div>
  </div>
  <div class="top"><span>29 AÑOS</span></div>
  <div class="sub">SIN LEER<br>ESTE MENSAJE</div>
  <div class="bubble">
    <div class="who">Aviso 📢</div>
    <div class="paper">LA GUERRA<br>TERMINÓ</div>
    <div class="meta"><span class="y">1945</span><span class="seen">Visto: 1974 ✓✓</span></div>
  </div>
  <div class="stamp"><span>¡NADIE LE AVISÓ!</span></div>
</body></html>
