<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFD6E0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="31.5" data-width="1080" data-height="1920">
      <div id="stage" data-composition-id="stage" data-composition-src="compositions/stage.html"
        data-start="0" data-duration="31.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="31.5" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <audio id="vo" class="clip" src="assets/voz.wav" data-start="0" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-yell" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="2.12" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-glia" class="clip" src="assets/sfx/pop.mp3" data-start="2.53" data-duration="0.72" data-track-index="5" data-volume="0.6"></audio>
      <audio id="sfx-beta" class="clip" src="assets/sfx/pop.mp3" data-start="13.8" data-duration="0.72" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-five" class="clip" src="assets/sfx/ping.mp3" data-start="22.86" data-duration="1.32" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-pillow" class="clip" src="assets/sfx/sparkle.mp3" data-start="27.85" data-duration="1.8" data-track-index="4" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
