      sweep: { px: -8, sw: 1, pil: 0 },
      point: { px: -10, sw: 0, pil: 0 },
      pillow: { px: -10, sw: 0, pil: 1 },
    };
    const GKEYS = [[0, "sweep"], [27.9, "pillow"]];

    function mood(keys, table, t) {
      let i = 0;
      while (i + 1 < keys.length && t >= keys[i + 1][0]) i++;
      const cur = table[keys[i][1]];
      const since = t - keys[i][0];
      if (i === 0 || since >= 0.25) return { s: cur, since };
      const prev = table[keys[i - 1][1]], k = smooth(since / 0.25), out = {};
      for (const p in cur) out[p] = lerp(prev[p], cur[p], k);
      return { s: out, since };
    }
    const mouthAt = (who, t) => {
      const a = D.mouth && D.mouth[who];
      if (!a) return 0;
      const f = Math.min(Math.max(Math.round(t * FPS), 0), a.length - 1);
      return a[f];
    };
    const blink = (t, period, offset) => ((t + offset) % period) < 0.12;
    const set = (id, attr, v) => $(id).setAttribute(attr, v);

    function render(t) {
      set("st-turb", "seed", (Math.floor(t * 12) % 40) + 1);  // line boil, 12 times a second

      // ---- Neuro ----
      const { s: n, since } = mood(NKEYS, NEURO, t);
      // anticipation and settle on each mood change: squash 0.92 → 1.04 → 1
      let sy = 1 + 0.015 * Math.sin(t * 2.4);
      if (since < 0.1) sy *= lerp(1, 0.92, since / 0.1);
      else if (since < 0.22) sy *= lerp(0.92, 1.04, (since - 0.1) / 0.12);
      else if (since < 0.4) sy *= lerp(1.04, 1, (since - 0.22) / 0.18);
      const sx = 1 + (1 - sy) * 0.6;
      set("n-squash", "transform", `translate(260 590) scale(${sx} ${sy}) translate(-260 -590)`);
      const shakeX = Math.sin(t * 55) * 7 * n.shake, shakeR = Math.sin(t * 41) * 2 * n.shake;
      set("n-shake", "transform", `translate(${shakeX} 0) rotate(${shakeR} 260 560)`);
      set("n-tilt", "transform", `rotate(${n.tilt} 260 420)`);
      set("n-armL", "transform", `rotate(${n.al + Math.sin(t * 9) * 8 * n.shake} 110 320)`);
      set("n-armR", "transform", `rotate(${n.ar - Math.sin(t * 9 + 1) * 8 * n.shake} 410 320)`);
      set("n-browL", "transform", `translate(0 ${n.by}) rotate(${n.bl} 205 185)`);
      set("n-browR", "transform", `translate(0 ${n.by}) rotate(${n.br} 315 185)`);
      for (const [id, cx] of [["n-pupL", 205], ["n-pupR", 315]]) {
        set(id, "cx", cx + n.px); set(id, "cy", 255 + n.py); set(id, "r", 16 * n.pup);
      }
      const nl = blink(t, 3.1, 0.4) ? 1 : n.lid;
      set("n-lidL", "height", 100 * nl); set("n-lidR", "height", 100 * nl);
      for (const id of ["n-lidLineL", "n-lidLineR"]) {
        set(id, "opacity", nl > 0.05 ? 1 : 0); set(id, "transform", `translate(0 ${-50 + 100 * nl})`);
      }
      const no = Math.max(mouthAt("neuro", t), n.mo);
      const mrx = n.mw * (0.75 + 0.45 * no), mry = 6 + no * 62;
      for (const id of ["n-mouth", "n-mclipE"]) { set(id, "rx", mrx); set(id, "ry", mry); }
      set("n-tongue", "cy", 340 + mry * 0.75); set("n-tongue", "rx", mrx * 0.7);
      set("n-vein", "transform", `translate(405 85) scale(${n.vein * (1 + 0.12 * Math.sin(t * 14))})`);
      set("n-sweat", "opacity", n.sweat); set("n-sweat", "transform", `translate(0 ${n.sweat ? ((t * 60) % 40) : 0})`);
      set("n-q", "opacity", n.q); set("n-q", "transform", `translate(0 ${Math.sin(t * 5) * 6})`);
      set("n-bags", "opacity", n.bags);

      // ---- Glía ----
      const { s: g } = mood(GKEYS, GLIA, t);
      set("g-broom", "transform", `rotate(${Math.sin(t * 6.5) * 14 * g.sw} 372 196)`);
      for (const [id, cx] of [["g-pupL", 185], ["g-pupR", 255]]) set(id, "cx", cx + g.px);
      const gb = blink(t, 2.7, 1.3);
      for (const id of ["g-lidL", "g-lidR"]) set(id, "opacity", gb ? 1 : 0);
      for (const id of ["g-pupL", "g-pupR"]) set(id, "opacity", gb ? 0 : 1);
      const go = mouthAt("glia", t);
      set("g-mouth", "rx", 20 + go * 10); set("g-mouth", "ry", 5 + go * 38);
      const pil = g.pil;
      set("g-pillow", "transform", `translate(40 210) scale(${pil})`);

      // ---- flies circling the trash ----
      [[1, 190, 1010, 0], [2, 880, 990, 2.1], [3, 560, 1120, 4.2]].forEach(([k, cx, cy, ph]) => {
        const x = cx + Math.cos(t * 3.1 + ph) * 70, y = cy + Math.sin(t * 4.7 + ph) * 34;
        set(`st-fly${k}`, "transform", `translate(${x} ${y}) scale(1 ${0.8 + 0.2 * Math.abs(Math.sin(t * 40 + ph))})`);
      });

      // ---- cutaway: goo drips from the working neurons, one drop a second each ----
      [["st-g1", 180, 640, 0], ["st-g2", 740, 680, 0.33], ["st-g3", 470, 900, 0.66], ["st-g4", 300, 640, 0.5], ["st-g5", 860, 680, 0.8]]
        .forEach(([id, x, y, ph]) => {
          const u = ((t - 10.4) * 0.9 + ph) % 1;
          set(id, "y", y + (u < 0 ? 0 : u) * 160); set(id, "opacity", t < 10.4 ? 0 : 1);
        });

      // ---- data card: goo surface wobble ----
      const lvl = $("st-level").getAttribute("y");
      set("st-surf", "transform", `translate(0 ${lvl - 900})`);
      set("st-surf", "d", `M330 900 Q415 ${880 + Math.sin(t * 6) * 8} 500 900 T670 900`);
    }

    const tl = gsap.timeline({ paused: true });
    const P = { t: 0 };
    tl.fromTo(P, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(P.t) }, 0);

    // ---- shot 1 → 2: Glía pops in, Neuro slides left ----
    tl.fromTo("#neuro", { x: 280, y: 560, scale: 1, transformOrigin: "50% 100%" }, { x: 70, scale: 0.92, duration: 0.45, ease: "power2.inOut" }, 2.6);
    tl.fromTo("#glia", { x: 1180, y: 640, rotation: 20, transformOrigin: "50% 100%" }, { x: 610, rotation: 0, duration: 0.42, ease: "back.out(1.6)" }, 2.62);

    // ---- shot 4: iris into the brain ----
    tl.fromTo("#st-zoom", { clipPath: "circle(0px at 310px 780px)" }, { clipPath: "circle(1500px at 310px 780px)", duration: 0.45, ease: "power3.inOut" }, 10.35);
    tl.fromTo("#st-n1", { attr: { y: 430 } }, { attr: { y: 410 }, duration: 0.3, ease: "sine.inOut", repeat: 14, yoyo: true }, 10.4);
    tl.fromTo("#st-n2", { attr: { y: 470 } }, { attr: { y: 450 }, duration: 0.34, ease: "sine.inOut", repeat: 12, yoyo: true }, 10.5);
    tl.fromTo("#st-n3", { attr: { y: 700 } }, { attr: { y: 680 }, duration: 0.28, ease: "sine.inOut", repeat: 15, yoyo: true }, 10.45);
    tl.fromTo("#st-beta span", { scale: 0, rotation: -20 }, { scale: 1, rotation: -4, duration: 0.35, ease: "back.out(2)" }, 13.88);
    tl.fromTo("#st-zoom", { clipPath: "circle(1500px at 310px 780px)" }, { clipPath: "circle(0px at 310px 780px)", duration: 0.35, ease: "power3.in", immediateRender: false }, 14.95);

    // ---- shot 6: colour flood to the data card ----
    tl.fromTo("#st-hdr", { y: 0 }, { y: -520, duration: 0.3, ease: "power3.in" }, 18.35);
    tl.fromTo("#st-card", { clipPath: "circle(0px at 820px 900px)" }, { clipPath: "circle(2200px at 820px 900px)", duration: 0.45, ease: "power2.inOut" }, 18.4);
    tl.fromTo("#st-ct1", { scale: 0, rotation: -8 }, { scale: 1, rotation: -3, duration: 0.35, ease: "back.out(1.8)" }, 20.85);
    tl.fromTo("#st-ct2", { scale: 0, rotation: 8 }, { scale: 1, rotation: 2, duration: 0.35, ease: "back.out(1.8)" }, 21.05);
    tl.fromTo("#st-level", { attr: { y: 900 } }, { attr: { y: 830 }, duration: 1.2, ease: "power2.out" }, 21.6);
    tl.fromTo("#st-five span", { scale: 3, rotation: 30, opacity: 0 }, { scale: 1, rotation: 8, opacity: 1, duration: 0.3, ease: "power4.out" }, 22.85);
    tl.fromTo("#st-src", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 19.0);
    tl.fromTo("#st-card", { clipPath: "circle(2200px at 820px 900px)" }, { clipPath: "circle(0px at 820px 900px)", duration: 0.35, ease: "power3.in", immediateRender: false }, 23.55);
    tl.fromTo("#st-hdr", { y: -520 }, { y: 0, duration: 0.4, ease: "back.out(1.4)", immediateRender: false }, 23.85);

    // ---- shot 7: the lost key ----
    tl.fromTo("#st-thinkG", { attr: { transform: "translate(560 560) scale(0)" } }, { attr: { transform: "translate(560 560) scale(1)" }, duration: 0.35, ease: "back.out(1.8)" }, 26.2);
    tl.fromTo("#st-thinkG", { attr: { transform: "translate(560 560) scale(1)" } }, { attr: { transform: "translate(560 560) scale(0)" }, duration: 0.2, ease: "power3.in", immediateRender: false }, 27.6);

    window.__timelines["stage"] = tl;
  </script>
</template>
