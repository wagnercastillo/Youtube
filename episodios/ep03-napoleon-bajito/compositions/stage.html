      const talking = [-0.2, -0.1, 0, 0.1, 0.2].some((d) => mouthAt(R.who, t + d) > 0.05);
      const co = talking ? mouthAt(R.who, t) : m.mo;
      const rx = 24 * (0.75 + 0.45 * co), ry = 5 + co * 34;
      for (const id of [p + "-mouth", p + "-mouthO", p + "-mclipE"]) { set(id, "rx", rx); set(id, "ry", ry); }
      set(p + "-tongue", "cy", R.mouth[1] + ry * 0.6); set(p + "-tongue", "rx", rx * 0.6);

        set("n-steam", "transform", `translate(0 ${-((t * 50) % 24)})`);
      }

    const P = { t: 0 };

    // ---- canvas flips: squash to a line, swap the drawing, open again ----
    function flip(t, from, to, half = 0.13) {
      tl.fromTo("#canvasG", { scaleX: 1 }, { scaleX: 0, duration: half, ease: "power2.in", svgOrigin: "540 705", immediateRender: false }, t);

      tl.set(to, { opacity: 1 }, t + half);
      tl.fromTo("#canvasG", { scaleX: 0 }, { scaleX: 1, duration: half + 0.03, ease: "back.out(1.6)", svgOrigin: "540 705", immediateRender: false }, t + half);
    }
    const pop = (sel, t, from = 0) => tl.fromTo(sel, { scale: from, opacity: 0, transformOrigin: "50% 50%" },
      { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, t);

    // ---- hook: Napoleón storms in ----
    tl.fromTo("#napo", { x: 620 }, { x: 0, duration: 0.35, ease: "back.out(1.4)" }, 0.05);

    tl.set("#cv0", { opacity: 0 }, 4.72);
    tl.set("#cv1", { opacity: 1 }, 4.72);
    pop("#cv1a", 4.72); pop("#cv1b", 5.74); pop("#cv1c", 6.72, 0.8);
    tl.fromTo("#st-hdr", { y: 0 }, { y: -440, duration: 0.22, ease: "power3.in" }, 8.2);

    // ---- the inch ----
    flip(8.4, "#cv1", "#cv2");
    tl.fromTo(["#cv2a", "#cv2at"], { scaleX: 0, svgOrigin: "269 590" }, { scaleX: 1, duration: 0.4, ease: "power3.out", svgOrigin: "269 590" }, 9.95);
    tl.fromTo(["#cv2b", "#cv2bt"], { scaleX: 0, svgOrigin: "269 710" }, { scaleX: 1, duration: 0.4, ease: "power3.out", svgOrigin: "269 710" }, 12.22);
    pop("#cv2c", 12.55, 0.8);

    // ---- the tape: ? → 1.68 m → average ----
    flip(14.6, "#cv2", "#cv3");
    tl.fromTo("#cv3m", { y: 380 }, { y: 0, duration: 0.5, ease: "power3.out" }, 17.1);
    tl.set("#cv3q", { opacity: 0 }, 17.55);
    tl.fromTo("#cv3h", { scale: 2.6, opacity: 0, rotation: 12, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: -3, duration: 0.24, ease: "power4.in" }, 17.55);
    tl.fromTo("#cv3avg", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 18.5);

    // ---- the giant guards and the keychain ----
    flip(20.45, "#cv3", "#cv4");
    pop("#cv4key", 23.82, 0.3);

    // ---- le petit caporal ----
    flip(26.85, "#cv4", "#cv5");
    pop("#cv5b", 28.4, 0.6);
    pop("#cv5h", 29.05, 0);

    // ---- normal size ----
    flip(30.5, "#cv5", "#cv6");

    // ---- the payoff: even smaller ----
    flip(36.35, "#cv6", "#cv7", 0.2);
    tl.set(["#cv7t", "#cv7n"], { opacity: 0 }, 39.6);
    tl.fromTo("#st-stamp span", { scale: 3.2, rotation: 18, opacity: 0 }, { scale: 1, rotation: -7, opacity: 1, duration: 0.22, ease: "power4.in" }, 39.62);
    tl.fromTo("#st-stamp span", { x: 0 }, { x: 10, duration: 0.05, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, 39.84);

    // ---- Napoleón explodes ----
    tl.fromTo("#napo", { y: 0 }, { y: -70, duration: 0.16, ease: "power2.out", immediateRender: false }, 41.26);
    tl.fromTo("#napo", { y: -70 }, { y: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, 41.42);

    // ---- end card: brand + follow ----
    tl.fromTo("#st-end", { y: 1920 }, { y: 0, duration: 0.32, ease: "power3.out" }, 42.45);
    tl.fromTo("#st-elogo", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)" }, 42.7);
    tl.fromTo("#st-etitle span", { scale: 0, rotation: 10 }, { scale: 1, rotation: -3, duration: 0.32, ease: "back.out(2)" }, 43.0);
    tl.fromTo("#st-esub", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 43.3);
    tl.fromTo("#st-efollow span", { scale: 0 }, { scale: 1, rotation: 2, duration: 0.3, ease: "back.out(2.2)" }, 43.7);

    window.__timelines["stage"] = tl;
  </script>
